<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Survey</title><meta name="description" content="Business owner interview cards"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#21352f;font:15px system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #d6dfd9;border-radius:10px;background:white;padding:11px 17px;color:inherit}button:hover{background:#eaf0eb}button:disabled{opacity:.35;cursor:default}header{max-width:1120px;margin:auto;padding:32px 24px 23px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:750}.brand span{display:block;font-size:12px;font-weight:500;color:#7a8980;margin-top:5px;letter-spacing:1px}nav{display:flex;gap:5px;background:#e7ece7;padding:5px;border-radius:13px}nav button{border:0;background:transparent}nav .active{background:white;box-shadow:0 2px 6px #2030200a}main{max-width:1000px;padding:12px 24px 50px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}h1{font-size:30px;letter-spacing:-1px;margin:0 0 7px}p{color:#78847d;margin:0}.primary{background:#254e3f;color:white;border-color:#254e3f}.primary:hover{background:#34614f}.card{background:white;border:1px solid #dce3dd;border-radius:20px;box-shadow:0 12px 45px #273e2d06;padding:30px;animation:appear .18s ease}@keyframes appear{from{opacity:.5;transform:translateX(8px)}}.cardtop{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid #edf0eb}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:700;color:#839087}.badge{font-size:12px;border-radius:20px;padding:7px 12px;background:#edf0ed;color:#6f7b73}.badge.yes{background:#e5f2e9;color:#34714d}.badge.no{background:#faeee9;color:#a2644d}.info{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:23px 0 30px}label{display:block;font-size:12px;font-weight:650;color:#69766e;margin-bottom:9px}input,textarea,select{border:1px solid #dce3dd;border-radius:9px;padding:12px;background:#fcfdfb;color:#21352f;width:100%;outline:none}input:focus,textarea:focus{border-color:#6b9580;box-shadow:0 0 0 3px #edf4ef}textarea{resize:vertical;min-height:76px;line-height:1.5}.questions{border-top:1px solid #edf0eb;margin-top:12px}.question{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;border-bottom:1px solid #edf0eb;padding:17px 0;align-items:center}.prompt{display:flex;gap:13px;line-height:1.55}.num{color:#a4b0a6;font-size:12px;padding-top:3px;min-width:18px}.question label{font-size:14px;font-weight:500;color:#34483d;margin:0;line-height:1.55}.notes{margin-top:24px}.actions{display:flex;justify-content:space-between;margin-top:24px;gap:12px}.no-btn{color:#a05c46;border-color:#edd7cf}.yes-btn{color:white;background:#254e3f;border-color:#254e3f}.yes-btn:hover{background:#34614f}.slider{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:20px;color:#79867c;font-size:13px}.slider button{padding:8px 15px}.saved{text-align:center;margin-top:16px;font-size:12px;color:#8a958d}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tools input{flex:1;min-width:180px}.tools select{width:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mini{background:white;border:1px solid #dce3dd;border-radius:16px;padding:23px}.mini h2{font-size:18px;margin:0 0 7px}.mini .badge{display:inline-block;margin:15px 0}.mini p{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.mini button{margin-top:15px;width:100%}.empty{padding:60px;text-align:center;grid-column:1/-1}.hidden{display:none!important}.hint{font-size:12px;color:#8a958d;margin-top:8px}@media(max-width:650px){header{padding:22px 18px;gap:15px}.brand{font-size:18px}nav button{padding:10px}main{padding:10px 15px 30px}h1{font-size:25px}.card{padding:20px}.info,.question,.grid{grid-template-columns:1fr}.question{gap:12px}.info{gap:14px}.actions button{padding:12px}.top p{font-size:13px}}
</style></head><body><header><div class="brand">Owner Survey<span>BUSINESS DISCOVERY</span></div><nav aria-label="Main navigation"><button id="surveyTab" class="active">Interview</button><button id="allTab">All cards <span id="count"></span></button></nav></header><main><section id="interview"><div class="top"><div><h1>Good questions. Real insights.</h1><p>One business, one conversation at a time.</p></div><button class="primary" id="new">+ New card</button></div><div class="card" id="card"></div><div class="slider"><button id="prev" aria-label="Previous card"></button><span id="position"></span><button id="next" aria-label="Next card"></button></div><div class="saved" id="saveState" role="status">Saved automatically in this browser</div></section><section id="all" class="hidden"><div class="top"><div><h1>All your conversations</h1><p id="summary"></p></div><button id="export">Export backup</button></div><div class="tools"><input id="search" aria-label="Search businesses" placeholder="Search business name or phone."><select id="filter" aria-label="Filter by pickup status"><option value="all">All statuses</option><option value="pending">Not called yet</option><option value="yes">Picked up</option><option value="no">Didn't pick up</option></select><button id="import">Import backup</button><input type="file" id="file" accept="application/json" hidden></div><div id="grid" class="grid"></div><p class="hint">Records stay in this browser. Export a backup to keep a separate copy.</p></section></main><script>
const questions=["How is your business organized, and who handles its primary functions?","Walk me through how a typical customer job moves through your business.","What are the three most frustrating or time-consuming problems you've experienced recently?","Can you describe the last time one of those problems occurred, and what it cost you?","What software do you use, and how do those systems communicate?","Which activities require the most manual data entry, coordination or repetitive work?","What have you previously tried or purchased to solve these problems?","Which of these problems are you actively trying to solve, and who would approve spending money on a solution?"];
const $=id=>document.getElementById(id),key='owner-survey-v1';let records=[],index=0,storageOK=true;const blank=()=>({id:crypto.randomUUID(),name:'',phone:'',answers:Array(8).fill(''),notes:'',status:'pending',updated:new Date().toISOString()});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const data=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(data))records=data.map(normalize)}catch(e){storageOK=false}if(!records.length)records=[blank()];
function normalize(r){if(!r||typeof r!=='object')throw Error('Invalid record');return{id:typeof r.id==='string'?r.id:crypto.randomUUID(),name:String(r.name||''),phone:String(r.phone||''),answers:Array.from({length:8},(_,i)=>String(r.answers?.[i]||'')),notes:String(r.notes||''),status:['yes','no','pending'].includes(r.status)?r.status:'pending',updated:String(r.updated||new Date().toISOString())}}
function save(){try{localStorage.setItem(key,JSON.stringify(records));storageOK=true;$('saveState').textContent='All changes saved � in this browser'}catch(e){storageOK=false;$('saveState').textContent='Could not save in this browser. Export a backup from All cards.'}$('count').textContent=records.length}
const statusText=s=>s==='yes'?'Picked up':s==='no'?"Didn't pick up":'Not called yet';
function render(){const r=records[index];$('card').innerHTML=`<div class="cardtop"><span class="eyebrow">BUSINESS INTERVIEW � ${String(index+1).padStart(2,'0')}</span><span class="badge ${r.status}">${statusText(r.status)}</span></div><div class="info"><div><label for="name">Business name</label><input id="name" placeholder="e.g. Atlantic Air Conditioning" value="${esc(r.name)}"></div><div><label for="phone">Phone number</label><input id="phone" type="tel" placeholder="(555) 000-0000" value="${esc(r.phone)}"></div></div><div class="eyebrow">CORE QUESTIONS</div><div class="questions">${questions.map((q,i)=>`<div class="question"><div class="prompt"><span class="num">${String(i+1).padStart(2,'0')}</span><label for="answer${i}">${q}</label></div><textarea id="answer${i}" data-answer="${i}" placeholder="Capture their answer.">${esc(r.answers[i])}</textarea></div>`).join('')}</div><div class="notes"><label for="notes">Miscellaneous notes</label><textarea id="notes" placeholder="Anything else worth remembering.">${esc(r.notes)}</textarea></div><div class="actions"><button class="no-btn" id="no" aria-pressed="${r.status==='no'}">? &nbsp; Didn't pick up</button><button class="yes-btn" id="yes" aria-pressed="${r.status==='yes'}">� &nbsp; Picked up</button></div>`;$('position').textContent=`${index+1} of ${records.length} cards`;$('prev').disabled=index===0;$('next').disabled=index===records.length-1;$('count').textContent=records.length;['name','phone','notes'].forEach(k=>$(k).oninput=e=>{r[k]=e.target.value;r.updated=new Date().toISOString();save()});document.querySelectorAll('[data-answer]').forEach(el=>el.oninput=e=>{r.answers[Number(el.dataset.answer)]=e.target.value;r.updated=new Date().toISOString();save()});['yes','no'].forEach(s=>$(s).onclick=()=>{r.status=r.status===s?'pending':s;r.updated=new Date().toISOString();save();render()});if(!storageOK)$('saveState').textContent='Browser storage unavailable. Export a backup from All cards.'}
function tab(all){$('interview').classList.toggle('hidden',all);$('all').classList.toggle('hidden',!all);$('surveyTab').classList.toggle('active',!all);$('allTab').classList.toggle('active',all);if(all)renderAll()}
function renderAll(){const query=$('search').value.toLowerCase(),filter=$('filter').value;const matches=records.map((r,i)=>({r,i})).filter(({r})=>(r.name+' '+r.phone).toLowerCase().includes(query)&&(filter==='all'||r.status===filter));$('summary').textContent=`${records.length} businesses � ${records.filter(r=>r.status==='yes').length} picked up � ${records.filter(r=>r.status==='no').length} didn't pick up`;$('grid').innerHTML=matches.length?matches.map(({r,i})=>`<article class="mini"><h2>${esc(r.name||'Untitled business')}</h2><p>${esc(r.phone||'No phone number')}</p><span class="badge ${r.status}">${statusText(r.status)}</span><p>${r.answers.filter(a=>a.trim()).length}/8 answers recorded</p>${r.notes?`<p>${esc(r.notes.slice(0,150))}${r.notes.length>150?'.':''}</p>`:''}<button data-open="${i}">Open card </button></article>`).join(''):'<p class="empty">No cards match your search.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{index=Number(b.dataset.open);render();tab(false);window.scrollTo(0,0)})}
$('new').onclick=()=>{records.push(blank());index=records.length-1;save();render();window.scrollTo(0,0);$('name').focus()};$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<records.length-1){index++;render()}};$('surveyTab').onclick=()=>tab(false);$('allTab').onclick=()=>tab(true);$('search').oninput=renderAll;$('filter').onchange=renderAll;
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),questions,records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='owner-survey-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text()),rows=Array.isArray(data)?data:data.records;if(!Array.isArray(rows))throw Error();const imported=rows.map(normalize);for(const r of imported){const i=records.findIndex(x=>x.id===r.id);if(i<0)records.push(r);else if(r.updated>records[i].updated)records[i]=r}save();render();renderAll();alert(`Imported ${imported.length} cards. Existing cards were kept; newer versions were merged.`)}catch(err){alert('This file is not a valid survey backup.')}e.target.value=''};render();
</script></body></html>
